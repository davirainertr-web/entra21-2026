<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <label>informe cep</label>
    <input type="text" id="cep" placeholder="EX:89107-000" onblur="buscarLogradouro()" value="89012-020" />

    <input type="text" id="rua" />
    <input type="text" id="bairro" />
    <input type="text" id="localidade" />
    <input type="text" id="estado" />
    <input type="text" id="região" />
    <input type="text" id="ddd" />

    <script>
        function buscarLogradouro() {
            const cep = document.getElementById('cep')
            fetch(`http://viacep.com.br/ws/${cep.value}/json/`)
                .then(dados => dados.json())
                .then(resposta => {
                    console.log(resposta)
                    document.getElementById('rua').value = resposta.logradouro
                    document.getElementById('bairro').value = resposta.bairro
                    document.getElementById('localidade').value = resposta.localidade
                    document.getElementById('estado').value = resposta.estado
                    document.getElementById('região').value = resposta.regiao
                    document.getElementById('ddd').value = resposta.ddd
                })

        }
    </script>
</body>

</html>
