    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sistema de Cadastro</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="titulo">
            Cadastro de Clientes
        </div>
        <div class="informacoes">
            <h1>Nome Completo</h1>
            <input type="text" class="campo-resposta" placeholder="ex: Hugo Moura" />
            <h2>Email</h2>
            <input type="text" class="campo-resposta" placeholder="ex: hugo.moura@email.com" />
            <h3>Telefone</h3>
            <input type="text" class="campo-resposta" placeholder="ex: (11) 99999-9999" />
            <button>Cadastrar</button>
        </div>
    <script src="script.js"></script>
    </body>
    </html>
