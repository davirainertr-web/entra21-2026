<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="cadastro-body">

    <div class="titulo">
        Cadastro de Clientes
    </div>

    <div class="informacoes">

        <h1>Nome Completo</h1>

        <input type="text"
               class="campo-resposta"
               placeholder="ex: Hugo Moura" />

        <span class="mensagem-erro" id="erro-nome"></span>


        <h2>Email</h2>

        <input type="text"
               class="campo-resposta"
               placeholder="ex: hugo.moura@email.com" />

        <span class="mensagem-erro" id="erro-email"></span>


        <h3>Telefone</h3>

        <input type="text"
               class="campo-resposta"
               placeholder="(11) 99999-9999" />

        <span class="mensagem-erro" id="erro-telefone"></span>


        <button class="cadastrar">
            Cadastrar
        </button>

        <a href="menu.html" class="voltar">
            ← Voltar
        </a>

    </div>

    <script src="app.js"></script>

</body>
</html>
