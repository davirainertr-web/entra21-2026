<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo da Velha</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    #tabuleiro {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      gap: 5px;
      justify-content: center;
      margin: 20px auto;
    }

    .casa {
      width: 80px;
      height: 80px;
      font-size: 24px;
      cursor: pointer;
    }

    #status {
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>Jogo da Velha</h1>

<div id="tabuleiro"></div>
<div id="status">Jogador: X</div>

<script>
  let tabuleiro = [
    ["", "", ""],
    ["", "", ""],
    ["", "", ""]
  ];

  let jogador = "X";
  const tabuleiroDiv = document.getElementById("tabuleiro");
  const statusDiv = document.getElementById("status");

  function renderizar() {
    tabuleiroDiv.innerHTML = "";

    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        const btn = document.createElement("button");
        btn.classList.add("casa");
        btn.textContent = tabuleiro[i][j];

        btn.onclick = () => jogar(i, j);

        tabuleiroDiv.appendChild(btn);
      }
    }
  }

  function jogar(i, j) {
    if (tabuleiro[i][j] === "X" || tabuleiro[i][j] === "O") {
      alert("Essa posição já está ocupada!");
      return;
    }

    tabuleiro[i][j] = jogador;

    if (verificarVitoria(jogador)) {
      renderizar();
      setTimeout(() => {
      alert("Jogador " + jogador + " venceu!");
      resetar();
      }, 50);
      return;
    }

    if (verificarEmpate()) {
      renderizar();
      setTimeout(() => {
      alert("Empate!");
      resetar();
      }, 50 );
      return;
    }

    jogador = jogador === "X" ? "O" : "X";
    statusDiv.textContent = "Jogador: " + jogador;

    renderizar();
  }

  function verificarVitoria(jogador) {
    for (let i = 0; i < 3; i++) {
      if (tabuleiro[i][0] === jogador &&
          tabuleiro[i][1] === jogador &&
          tabuleiro[i][2] === jogador) return true;
    }

    for (let i = 0; i < 3; i++) {
      if (tabuleiro[0][i] === jogador &&
          tabuleiro[1][i] === jogador &&
          tabuleiro[2][i] === jogador) return true;
    }

    if (tabuleiro[0][0] === jogador &&
        tabuleiro[1][1] === jogador &&
        tabuleiro[2][2] === jogador) return true;

    if (tabuleiro[0][2] === jogador &&
        tabuleiro[1][1] === jogador &&
        tabuleiro[2][0] === jogador) return true;

    return false;
  }

  function verificarEmpate() {
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        if (tabuleiro[i][j] !== "X" && tabuleiro[i][j] !== "O") {
          return false;
        }
      }
    }
    return true;
  }

  function resetar() {
    tabuleiro = [
      ["", "", ""],
      ["", "", ""],
      ["", "", ""]
    ];
    jogador = "X";
    statusDiv.textContent = "Jogador: X";
    renderizar();
  }

  renderizar();
</script>

</body>
</html>
