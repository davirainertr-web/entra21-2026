<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>

    <form action="">
        <input type="text" id="nome" placeholder="Ex: Ana" >
        <input type="text" id="email" placeholder="Ex: ana@gmail.com" >

        <button type="button" onclick="gravar()">
            gravar
        </button>
    </form>

    <p id="hello"></p>

    <button type="button"
        onclick="document.getElementById('hello').style.color = 'red'">
        red
    </button>

    <p class="numero">1</p>
    <p class="numero">2</p>
    <p class="numero">3</p>

    <a href="../../index.html">home</a>

    <script>

        const inputs = document.getElementsByTagName("input");
        console.log(inputs[0]);

        const inputHello = document.getElementById("hello");
        inputHello.innerHTML = "Hello World";

        const myNumeros = document.querySelectorAll(".numero");
        myNumeros[1].innerHTML = "banana";

        function gravar() {

            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;

            console.log(nome);
            console.log(email);

            const inputNome = document.getElementById("nome");
            const inputEmail = document.getElementById("email");

            if (email.includes("@") && email.includes(".com")) {
                inputEmail.style.backgroundColor = "rgba(0,255,0,0.2)";
            } else {
                alert("Email inválido!");
                inputEmail.style.backgroundColor = "rgba(255,0,0,0.2)";
            }

            if (nome.length > 0) {
                inputNome.style.backgroundColor = "lightblue";
            } else {
                alert("Nome inválido!");
                inputNome.style.backgroundColor = "rgba(255,0,0,0.2)";
            }
        }

    </script>

</body>

</html>
