<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> Trabalhando com fuções</h2>
    <button onclick="ola()">Clique</button>
    <script>
        console.log('olá mundo')

        function ola(){
            console.log('olá de novo')
        }

        ola()

        function dobro(n1){
            let x = n1 * 2
            console.log(x)
        }

        function dividir(n1, n2) {
            var x = n1 / n2
            console.log(x)
        }

        dobro(10)
        dividir(100,2)

        function subtrair(n1,n2) {
            var x = n1-n2
            return x
        }

        let retorno = subtrair(100,10)
        console.log(retorno)

        const gravar = function(nome){
            console.log(`Salvando: ${nome}`)
        }

        gravar("Ana da Silva")

        const nomeCompleto = function(nome, sobreNome) {
            console.log(`${nome} ${sobreNome}`)
        }

        nomeCompleto('Ana', 'da Silva')

        const media = (n1,n2) => {
            let soma = n1 + n2
            console.log(soma/2)
        }
        
        media(20,30)

    </script>
</body>
</html>
